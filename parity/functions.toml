# The function set parity is measured against.
#
# Tier 1 is the v1 scope. Tier 2 is the next set worth having — functions
# common enough in real workbooks that not having them is a gap, not a
# decision. Tier 2 exists so "function coverage" measures something: a target
# list naming only what is already built would read 100% forever and tell a
# reader nothing.
#
# Adding a name here does not implement it. It states an intention, and the
# next report says how far off we are.

tier1 = [
  # Math and aggregation
  "SUM", "PRODUCT", "AVERAGE", "MIN", "MAX", "COUNT", "COUNTA", "COUNTBLANK",
  "ROUND", "ROUNDUP", "ROUNDDOWN", "ABS", "INT", "MOD", "POWER", "SQRT",
  # Logic
  "IF", "IFS", "AND", "OR", "NOT", "IFERROR", "ISBLANK", "ISNUMBER", "ISTEXT",
  "ISERROR",
  # Lookup
  "VLOOKUP", "HLOOKUP", "INDEX", "MATCH", "XLOOKUP", "CHOOSE",
  # Text
  "CONCAT", "CONCATENATE", "TEXTJOIN", "LEFT", "RIGHT", "MID", "LEN", "TRIM",
  "UPPER", "LOWER", "PROPER", "SUBSTITUTE", "REPLACE", "FIND", "SEARCH",
  "TEXT", "VALUE",
  # Conditional aggregation
  "COUNTIF", "COUNTIFS", "SUMIF", "SUMIFS", "AVERAGEIF", "AVERAGEIFS",
  # Date and time
  "TODAY", "NOW", "DATE", "YEAR", "MONTH", "DAY", "EOMONTH", "DATEDIF",
  "WEEKDAY", "RAND", "RANDBETWEEN",
]

tier2 = [
  # Aggregation people reach for immediately after the basics
  # COUNTUNIQUE was listed here and removed: it is a Google Sheets function,
  # not an Excel one, and a target list naming functions Excel does not have
  # makes the coverage number unreachable for a reason that is nobody's fault.
  "SUMPRODUCT", "MEDIAN", "MODE", "STDEV", "LARGE", "SMALL", "RANK",
  "SUBTOTAL", "AGGREGATE",
  # Error and type predicates that pair with the ones we have
  "IFNA", "ISNA", "ISERR", "ISLOGICAL", "ISREF", "NA", "TYPE",
  # Lookup, including the dynamic-array generation
  "XMATCH", "LOOKUP", "OFFSET", "INDIRECT", "ROW", "COLUMN", "ROWS", "COLUMNS",
  "TRANSPOSE", "UNIQUE", "SORT", "SORTBY", "FILTER", "SEQUENCE",
  # Text
  "TEXTSPLIT", "TEXTBEFORE", "TEXTAFTER", "REPT", "EXACT", "CHAR", "CODE",
  "CLEAN", "NUMBERVALUE", "LET",
  # Date and time
  "TIME", "HOUR", "MINUTE", "SECOND", "DATEVALUE", "TIMEVALUE", "NETWORKDAYS",
  "WORKDAY", "YEARFRAC", "EDATE", "DAYS",
  # Financial, the smallest set a business sheet expects
  "PMT", "FV", "PV", "NPV", "IRR", "RATE", "NPER",
  # Rounding and sign, the remainder of the everyday numeric set
  "CEILING", "FLOOR", "MROUND", "TRUNC", "SIGN", "GCD", "LCM", "EXP", "LN",
  "LOG", "LOG10",
]
