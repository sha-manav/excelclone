[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
# The crate ships two binaries — the API server and the demo seeder — so a
# bare `cargo run -p server` is ambiguous and fails. Naming the default here
# rather than passing `--bin server` at each call site fixes it for the
# scripts, the Makefile, and anyone who types the obvious thing.
default-run = "server"

[dependencies]
engine = { path = "../engine" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
thiserror = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
# `Stream` + `ReceiverStream`, so the JSONL export streams rows instead of
# buffering the whole dataset in memory.
tokio-stream = "0.1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
# Drive the router in process (`ServiceExt::oneshot`) and read its bodies.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
