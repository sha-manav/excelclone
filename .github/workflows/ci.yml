name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Wasm build
        run: cargo build -p gridline-wasm --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web app consumes the engine as a local file: dependency, so the
      # wasm package has to exist before npm resolves anything.
      - name: Build wasm package
        run: wasm-pack build crates/wasm --target web --out-dir pkg
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
