name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Wasm build
        run: cargo build -p gridline-wasm --target wasm32-unknown-unknown
      # Regenerates PARITY.md and fails if it differs from what is committed,
      # so the score in the repository is always the score the code earns.
      - name: Parity
        run: cargo run -q -p parity --bin gridline-parity -- report --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The web app consumes the engine as a local file: dependency, so the
      # wasm package has to exist before npm resolves anything.
      - name: Build wasm package
        run: wasm-pack build crates/wasm --target web --out-dir pkg
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: apps/web
        run: npx vitest run
      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      # A bare `tsc --noEmit` would check nothing: the root tsconfig is
      # solution-style and only holds project references.
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: apps/web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
