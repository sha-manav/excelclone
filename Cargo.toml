[workspace]
resolver = "2"
members = ["crates/engine", "crates/wasm", "crates/server", "crates/miner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
